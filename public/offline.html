<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Alfito Febriansyah</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0a0a0a;
        color: #e4e4e7;
        font-family: monospace;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .container {
        max-width: 400px;
        text-align: center;
      }
      .code {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #3f3f46;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 12px;
        color: #71717a;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      a {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #71717a;
        border: 1px solid #27272a;
        padding: 6px 16px;
        text-decoration: none;
        display: inline-block;
      }
      a:hover {
        color: #e4e4e7;
        border-color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="code">// offline</p>
      <h1>No Connection</h1>
      <p>
        You're currently offline. Please check your internet connection and try
        again. Pages you've visited before are still available in cache.
      </p>
      <a href="/">← Go Home</a>
    </div>
  </body>
</html>
